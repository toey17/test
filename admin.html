<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจัดการใบสมัครงาน — เจ้าหน้าที่/แอดมิน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F8F5EE;
    --paper-2:#F1EBDD;
    --ink:#20302B;
    --ink-soft:#54655D;
    --line:#D8CFB8;
    --line-strong:#20302B;
    --forest:#2F5D50;
    --forest-dark:#1B3B32;
    --rust:#8C4A38;
    --rust-bg:#F1DCD3;
    --white:#FFFEFB;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:1400px;margin:0 auto;padding:2.5rem 1.5rem 5rem;}
  header.top{margin-bottom:1.75rem;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--forest);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(24px,4vw,32px);
    margin:0 0 8px;
    color:var(--ink);
  }
  .sub{color:var(--ink-soft);font-size:15px;margin:0;max-width:60ch;}

  .panel{
    background:var(--white);
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    padding:2rem;
  }
  @media (max-width:560px){ .panel{padding:1.25rem;} }

  .field{margin-bottom:16px;max-width:360px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:500;
    color:var(--ink);
    margin-bottom:6px;
  }
  input[type=text], input[type=password], select, textarea{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:16px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--forest);
    box-shadow:0 0 0 3px rgba(47,93,80,0.15);
  }
  textarea{min-height:40px;resize:vertical;}

  .submit-row{margin-top:1rem;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  button.primary{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    background:var(--forest);
    color:var(--white);
    border:none;
    padding:12px 24px;
    border-radius:8px;
    cursor:pointer;
  }
  button.primary:hover{background:var(--forest-dark);}
  button.primary:disabled{opacity:0.5;cursor:not-allowed;}
  .status-msg{font-size:13px;color:var(--ink-soft);}
  .status-msg.err{color:var(--rust);font-weight:600;}
  .status-msg.ok{color:var(--forest);}

  button.small{
    font-family:'Inter',sans-serif;font-size:12px;font-weight:600;
    background:var(--forest);color:var(--white);border:none;
    padding:6px 12px;border-radius:6px;cursor:pointer;
  }
  button.small.danger{background:var(--rust);}
  button.small.ghost{background:var(--paper-2);color:var(--forest);border:1px solid var(--line);}
  button.small:disabled{opacity:0.5;cursor:not-allowed;}

  table.staff-table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:1000px;}
  table.staff-table th, table.staff-table td{
    border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;
  }
  table.staff-table th{background:var(--paper-2);font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:11px;text-transform:uppercase;}
  table.staff-table select, table.staff-table input[type=text], table.staff-table textarea{
    font-size:12px;padding:5px 6px;min-width:110px;
  }
  table.staff-table textarea{min-height:40px;}
  table.staff-table td .action-cell{display:flex;gap:8px;flex-wrap:wrap;}

  .badge{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;
    padding:2px 9px;border-radius:20px;font-weight:500;
  }
  .badge.รอพิจารณา{background:var(--gold-bg, #F3E6C4);color:#A67C1E;}
  .badge.ผ่านการพิจารณา{background:#E4EEE9;color:var(--forest-dark);}
  .badge.ไม่ผ่านการพิจารณา{background:var(--rust-bg);color:var(--rust);}
  .badge.นัดสัมภาษณ์{background:#E4EEE9;color:var(--forest-dark);}

  .file-link{color:var(--forest);font-weight:600;cursor:pointer;text-decoration:underline;}

  .app-modal{display:none;position:fixed;inset:0;background:rgba(32,48,43,0.75);z-index:1002;align-items:center;justify-content:center;padding:2rem;}
  .app-modal.show{display:flex;}
  .app-modal-inner{
    background:var(--white);border-radius:var(--radius);width:100%;max-width:800px;
    max-height:90vh;overflow-y:auto;padding:2rem;position:relative;
  }
  .app-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:18px;}
  .app-doc h2{font-family:'Fraunces',serif;font-size:22px;margin:0 0 4px;}
  .app-doc .doc-sub{color:var(--ink-soft);font-size:13px;margin-bottom:20px;}
  .app-doc .doc-section{margin-bottom:18px;}
  .app-doc .doc-section-title{
    font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;
    color:var(--forest);border-bottom:1px dashed var(--line);padding-bottom:4px;
    margin-bottom:10px;letter-spacing:.06em;
  }
  .app-doc .doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;}
  .app-doc .doc-item strong{
    display:block;font-size:11px;color:var(--ink-soft);text-transform:uppercase;
    font-family:'IBM Plex Mono',monospace;margin-bottom:2px;
  }
  .app-doc .doc-item{font-size:14px;white-space:pre-wrap;word-break:break-word;}

  @media print{
    .wrap, .file-modal, .confirm-modal{display:none !important;}
    .app-modal{
      display:block !important;
      position:static !important;
      background:none !important;
      padding:0 !important;
      inset:auto !important;
    }
    .app-modal-inner{
      position:static !important;
      max-height:none !important;
      overflow:visible !important;
      padding:0 !important;
      border:none !important;
      box-shadow:none !important;
    }
    .no-print{display:none !important;}
  }

  .file-link{color:var(--forest);font-weight:600;cursor:pointer;text-decoration:underline;}
  .file-modal{display:none;position:fixed;inset:0;background:rgba(32,48,43,0.75);z-index:1003;align-items:center;justify-content:center;padding:2rem;}
  .file-modal.show{display:flex;}
  .file-modal-inner{background:var(--white);border-radius:var(--radius);width:100%;max-width:900px;height:85vh;display:flex;flex-direction:column;overflow:hidden;}
  .file-modal-inner iframe{flex:1;border:none;width:100%;}
  #fileModalClose{
    align-self:flex-end;margin:8px 12px 0 0;background:var(--rust);color:var(--white);
    border:none;padding:6px 14px;border-radius:6px;cursor:pointer;
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
  }

  .confirm-modal{display:none;position:fixed;inset:0;background:rgba(32,48,43,0.75);z-index:1000;align-items:center;justify-content:center;padding:2rem;}
  .confirm-modal.show{display:flex;}
  .confirm-modal-inner{background:var(--white);border-radius:var(--radius);width:100%;max-width:420px;padding:1.5rem;}
  .confirm-modal-inner p{font-size:14px;color:var(--ink);margin:0 0 18px;white-space:pre-wrap;line-height:1.5;}
  .confirm-modal-actions{display:flex;justify-content:flex-end;gap:8px;}

  @media (max-width:560px){
    button.primary{width:100%;padding:14px 24px;font-size:15px;}
    button.small{padding:10px 16px;font-size:13px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="eyebrow">ระบบรับสมัครงาน</p>
    <h1>หน้าจัดการใบสมัคร — สำหรับเจ้าหน้าที่ / แอดมิน</h1>
    <p class="sub">เข้าสู่ระบบด้วยรหัสผ่านเพื่อดู แก้ไข หรือลบใบสมัครทั้งหมด</p>
  </header>

  <section class="panel">
    <div id="staffLoginBox">
      <div class="field">
        <label>รหัสผ่าน</label>
        <input type="password" id="staffPassword" placeholder="กรอกรหัสผ่านเจ้าหน้าที่หรือแอดมิน">
      </div>
      <div class="submit-row">
        <button type="button" class="primary" id="staffLoginBtn">เข้าสู่ระบบ</button>
        <span class="status-msg" id="staffLoginStatus"></span>
      </div>
    </div>

    <div id="staffPanel" style="display:none;">
      <div class="submit-row" style="margin-bottom:1rem;">
        <span class="status-msg" id="staffRoleLabel"></span>
        <button type="button" class="small" id="staffRefreshBtn">รีเฟรชข้อมูล</button>
        <button type="button" class="small" id="exportCsvBtn">ดาวน์โหลดข้อมูล (CSV)</button>
        <button type="button" class="small danger" id="staffLogoutBtn">ออกจากระบบ</button>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);">
          <input type="checkbox" id="autoSaveToggle" style="width:auto;"> บันทึกอัตโนมัติ (แก้แล้วเซฟทันที ไม่ต้องกดปุ่มบันทึก)
        </label>
        <span class="status-msg" id="staffPanelStatus"></span>
      </div>
      <div id="staffTableWrap" style="overflow-x:auto;"></div>
    </div>
  </section>
</div>

<!-- ป๊อปอัพดูไฟล์แนบในหน้าเว็บ ไม่เปิดแท็บใหม่ -->
<div class="file-modal" id="fileModal">
  <div class="file-modal-inner">
    <button type="button" id="fileModalClose">✕ ปิด</button>
    <iframe id="fileModalFrame" src=""></iframe>
  </div>
</div>

<!-- กล่องยืนยันแบบกำหนดเอง (ใช้แทน confirm() ของเบราว์เซอร์) -->
<div class="confirm-modal" id="confirmModal">
  <div class="confirm-modal-inner">
    <p id="confirmModalMessage"></p>
    <div class="confirm-modal-actions">
      <button type="button" class="small ghost" id="confirmModalCancel">ยกเลิก</button>
      <button type="button" class="small danger" id="confirmModalOk">ยืนยัน</button>
    </div>
  </div>
</div>

<!-- ป๊อปอัพใบสมัครแบบเต็ม (ดูรายละเอียด + พิมพ์/ดาวน์โหลด PDF) -->
<div class="app-modal" id="appModal">
  <div class="app-modal-inner">
    <div class="app-modal-actions no-print">
      <button type="button" class="small ghost" id="appModalPrint">🖨️ พิมพ์</button>
      <button type="button" class="small" id="appModalDownload">⬇️ ดาวน์โหลด PDF</button>
      <button type="button" class="small danger" id="appModalClose">✕ ปิด</button>
    </div>
    <div id="appModalBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const STATUS_OPTIONS = ['รอพิจารณา', 'นัดสัมภาษณ์', 'ผ่านการพิจารณา', 'ไม่ผ่านการพิจารณา'];
let staffSession = { password: null, role: null };
let lastResults = [];

// วาง Web app URL ตรงนี้
const SHEET_ENDPOINT = 'https://script.google.com/macros/s/AKfycbx5K-fbnfBR-0IqtbVr_OQZjfL0cWY6nMWZIl6ZVHyw2axpnpnYCikBEaSq0U4tNuCS/exec';

// ================= เปิดดูไฟล์แนบในหน้าเว็บ =================
function openFilePreview(url){
  const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  const fileId = match ? match[1] : null;
  const previewUrl = fileId ? `https://drive.google.com/file/d/${fileId}/preview` : url;
  $('fileModalFrame').src = previewUrl;
  $('fileModal').classList.add('show');
}
$('fileModalClose').addEventListener('click', () => {
  $('fileModal').classList.remove('show');
  $('fileModalFrame').src = '';
});
$('fileModal').addEventListener('click', (e) => {
  if(e.target.id === 'fileModal'){
    $('fileModal').classList.remove('show');
    $('fileModalFrame').src = '';
  }
});

// ================= หน้าต่างยืนยันแบบกำหนดเอง =================
function customConfirm(message){
  return new Promise((resolve) => {
    $('confirmModalMessage').textContent = message;
    $('confirmModal').classList.add('show');
    const okBtn = $('confirmModalOk');
    const cancelBtn = $('confirmModalCancel');
    const cleanup = () => {
      $('confirmModal').classList.remove('show');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
    };
    const onOk = () => { cleanup(); resolve(true); };
    const onCancel = () => { cleanup(); resolve(false); };
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
  });
}

// ================= เข้าสู่ระบบเจ้าหน้าที่ / แอดมิน =================
// กด Enter ในช่องรหัสผ่านแทนการกดปุ่มเข้าสู่ระบบได้
$('staffPassword').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    e.preventDefault();
    $('staffLoginBtn').click();
  }
});

$('staffLoginBtn').addEventListener('click', async () => {
  const pw = $('staffPassword').value;
  const statusEl = $('staffLoginStatus');
  if(!pw){
    statusEl.textContent = 'กรุณากรอกรหัสผ่าน';
    statusEl.className = 'status-msg err';
    return;
  }
  statusEl.textContent = 'กำลังเข้าสู่ระบบ...';
  statusEl.className = 'status-msg';
  $('staffLoginBtn').disabled = true;
  try{
    const url = SHEET_ENDPOINT + '?action=list&password=' + encodeURIComponent(pw);
    const res = await fetch(url);
    const data = await res.json();
    if(data.status !== 'ok'){
      statusEl.textContent = data.message || 'เข้าสู่ระบบไม่สำเร็จ';
      statusEl.className = 'status-msg err';
      $('staffLoginBtn').disabled = false;
      return;
    }
    staffSession = { password: pw, role: data.role };
    $('staffLoginBox').style.display = 'none';
    $('staffPanel').style.display = 'block';
    $('staffRoleLabel').textContent = 'เข้าสู่ระบบในฐานะ: ' + (data.role === 'admin' ? 'แอดมิน' : 'เจ้าหน้าที่') + ' (แก้ไข/ลบได้ทุกอย่าง)';
    $('staffRoleLabel').className = 'status-msg ok';
    lastResults = data.results;
    renderStaffTable(data.results);
  }catch(err){
    statusEl.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
    statusEl.className = 'status-msg err';
  }
  $('staffLoginBtn').disabled = false;
});

$('staffLogoutBtn').addEventListener('click', () => {
  staffSession = { password: null, role: null };
  lastResults = [];
  $('staffPanel').style.display = 'none';
  $('staffLoginBox').style.display = 'block';
  $('staffPassword').value = '';
  $('staffLoginStatus').textContent = '';
  $('staffTableWrap').innerHTML = '';
});

$('staffRefreshBtn').addEventListener('click', async () => {
  const statusEl = $('staffPanelStatus');
  statusEl.textContent = 'กำลังรีเฟรช...';
  statusEl.className = 'status-msg';
  try{
    const url = SHEET_ENDPOINT + '?action=list&password=' + encodeURIComponent(staffSession.password);
    const res = await fetch(url);
    const data = await res.json();
    if(data.status !== 'ok'){
      statusEl.textContent = data.message || 'รีเฟรชไม่สำเร็จ';
      statusEl.className = 'status-msg err';
      return;
    }
    lastResults = data.results;
    renderStaffTable(data.results);
    statusEl.textContent = 'อัปเดตล่าสุดแล้ว';
    statusEl.className = 'status-msg ok';
  }catch(err){
    statusEl.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
    statusEl.className = 'status-msg err';
  }
});

// ================= ป๊อปอัพใบสมัครแบบเต็ม (ดูรายละเอียด + พิมพ์/ดาวน์โหลด PDF) =================
let currentModalRecord = null;

function openApplicationModal(r){
  currentModalRecord = r;
  const dateStr = r.date ? new Date(r.date).toLocaleDateString('th-TH', {year:'numeric', month:'long', day:'numeric'}) : '-';
  const fileUrls = (r.files || '').split('\n').filter(Boolean);
  const filesHtml = fileUrls.length
    ? fileUrls.map((url,i)=>`<span class="file-link no-print" data-url="${escapeHtml(url)}">ไฟล์แนบ ${i+1}</span>`).join('<br>')
    : '-';

  $('appModalBody').innerHTML = `
    <div class="app-doc">
      <h2>ใบสมัครงาน — ${escapeHtml(r.name)}</h2>
      <p class="doc-sub">
        เลขที่ใบสมัคร: ${escapeHtml(r.receiptNo)} &nbsp;|&nbsp;
        ยื่นเมื่อ: ${dateStr} &nbsp;|&nbsp;
        สถานะ: <span class="badge ${escapeHtml(r.status||'')}">${escapeHtml(r.status||'-')}</span>
      </p>

      <div class="doc-section">
        <div class="doc-section-title">ข้อมูลส่วนตัว</div>
        <div class="doc-grid">
          <div class="doc-item"><strong>ชื่อ-นามสกุล</strong>${escapeHtml(r.name)}</div>
          <div class="doc-item"><strong>วันเกิด</strong>${escapeHtml(r.dob || '-')}</div>
          <div class="doc-item"><strong>เบอร์โทรศัพท์</strong>${escapeHtml(r.phone)}</div>
          <div class="doc-item"><strong>อีเมล</strong>${escapeHtml(r.email)}</div>
          <div class="doc-item" style="grid-column:span 2;"><strong>ที่อยู่ปัจจุบัน</strong>${escapeHtml(r.address || '-')}</div>
        </div>
      </div>

      <div class="doc-section">
        <div class="doc-section-title">ข้อมูลการสมัคร</div>
        <div class="doc-grid">
          <div class="doc-item"><strong>ตำแหน่งที่สมัคร</strong>${escapeHtml(r.position)}</div>
          <div class="doc-item"><strong>เงินเดือนที่คาดหวัง</strong>${escapeHtml(r.salary || '-')}</div>
          <div class="doc-item"><strong>วุฒิการศึกษาสูงสุด</strong>${escapeHtml(r.education || '-')}</div>
          <div class="doc-item"><strong>เกรดเฉลี่ยรวม</strong>${escapeHtml(r.gpa || '-')}</div>
          <div class="doc-item" style="grid-column:span 2;"><strong>มหาวิทยาลัยที่จบการศึกษา</strong>${escapeHtml(r.university || '-')}</div>
        </div>
      </div>

      <div class="doc-section">
        <div class="doc-section-title">ประสบการณ์ทำงาน</div>
        <div class="doc-item">${escapeHtml(r.experience || '-')}</div>
      </div>

      <div class="doc-section">
        <div class="doc-section-title">เอกสารที่แนบมาด้วย</div>
        <div class="doc-item">${escapeHtml(r.documents || '-')}</div>
      </div>

      <div class="doc-section">
        <div class="doc-section-title">ไฟล์แนบ</div>
        <div class="doc-item">${filesHtml}</div>
      </div>

      ${r.notes ? `
      <div class="doc-section">
        <div class="doc-section-title">หมายเหตุจากเจ้าหน้าที่</div>
        <div class="doc-item">${escapeHtml(r.notes)}</div>
      </div>` : ''}
    </div>
  `;

  $('appModalBody').querySelectorAll('.file-link').forEach(el => {
    el.addEventListener('click', () => openFilePreview(el.dataset.url));
  });

  $('appModal').classList.add('show');
}

$('appModalClose').addEventListener('click', () => {
  $('appModal').classList.remove('show');
});
$('appModal').addEventListener('click', (e) => {
  if(e.target.id === 'appModal') $('appModal').classList.remove('show');
});
$('appModalPrint').addEventListener('click', () => {
  window.print();
});

$('appModalDownload').addEventListener('click', () => {
  if(currentModalRecord) downloadApplicationPDF(currentModalRecord);
});

async function downloadApplicationPDF(r){
  const btn = $('appModalDownload');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'กำลังสร้าง PDF...';

  try{
    const canvas = await html2canvas($('appModalBody'), { scale: 2, backgroundColor: '#ffffff' });
    const imgData = canvas.toDataURL('image/png');

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;

    let heightLeft = imgHeight;
    let position = 0;

    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;

    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }

    const safeName = (r.name || 'ใบสมัคร').replace(/\s+/g, '');
    pdf.save('ใบสมัคร_' + safeName + '_' + r.receiptNo + '.pdf');
  }catch(err){
    const statusEl = $('staffPanelStatus');
    statusEl.textContent = 'สร้าง PDF ไม่สำเร็จ: ' + err.message;
    statusEl.className = 'status-msg err';
  }

  btn.disabled = false;
  btn.textContent = originalText;
}

function renderStaffTable(results){
  const wrap = $('staffTableWrap');
  if(!results.length){
    wrap.innerHTML = '<p class="sub">ยังไม่มีใบสมัครเข้ามา</p>';
    return;
  }
  const isAdmin = true; // แอดมินและเจ้าหน้าที่มีสิทธิ์แก้ไข/ลบเท่ากันแล้ว
  const table = document.createElement('table');
  table.className = 'staff-table';
  const headCols = ['','เลขที่ใบสมัคร','ชื่อ-นามสกุล','เบอร์โทร','อีเมล','ตำแหน่ง','สถานะ','หมายเหตุ', isAdmin ? 'จัดการ' : ''];
  table.innerHTML = '<thead><tr>' + headCols.map(h=>`<th>${h}</th>`).join('') + '</tr></thead>';
  const tbody = document.createElement('tbody');

  results.forEach((r) => {
    const tr = document.createElement('tr');

    const statusSelect = `<select data-field="status">${STATUS_OPTIONS.map(s=>`<option value="${s}" ${s===r.status?'selected':''}>${s}</option>`).join('')}</select>`;
    const notesInput = `<textarea data-field="notes">${escapeHtml(r.notes||'')}</textarea>`;
    const toggleBtnHtml = `<button type="button" class="small ghost" data-act="toggle">รายละเอียด</button>`;

    tr.innerHTML = `
      <td>${toggleBtnHtml}</td>
      <td>${escapeHtml(r.receiptNo)}</td>
      <td><input type="text" data-field="ชื่อ-นามสกุล" value="${escapeHtml(r.name)}"></td>
      <td><input type="text" data-field="เบอร์โทรศัพท์" value="${escapeHtml(r.phone)}"></td>
      <td><input type="text" data-field="อีเมล" value="${escapeHtml(r.email)}"></td>
      <td><input type="text" data-field="ตำแหน่งที่สมัคร" value="${escapeHtml(r.position)}"></td>
      <td>${statusSelect}</td>
      <td>${notesInput}</td>
      <td>
        <div class="action-cell">
          <button type="button" class="small" data-act="save">บันทึก</button>
          <button type="button" class="small danger" data-act="delete">ลบ</button>
        </div>
      </td>
    `;

    tr.querySelector('[data-act="save"]').addEventListener('click', () => saveRow(tr, r, isAdmin));
    const delBtn = tr.querySelector('[data-act="delete"]');
    if(delBtn) delBtn.addEventListener('click', () => deleteRow(r));
    tr.querySelector('[data-act="toggle"]').addEventListener('click', () => openApplicationModal(r));

    // กด Enter ในช่องกรอก (ยกเว้นช่องหมายเหตุ ที่ต้องเว้นไว้ให้ขึ้นบรรทัดใหม่ได้) แทนการกดปุ่มบันทึก
    tr.querySelectorAll('[data-field]').forEach(el => {
      if(el.tagName === 'TEXTAREA') return;
      el.addEventListener('keydown', (e) => {
        if(e.key === 'Enter'){
          e.preventDefault();
          saveRow(tr, r, isAdmin);
        }
      });
    });

    if($('autoSaveToggle').checked){
      tr.querySelectorAll('[data-field]').forEach(el => {
        const evt = el.tagName === 'SELECT' ? 'change' : 'blur';
        el.addEventListener(evt, () => saveRow(tr, r, isAdmin));
      });
    }

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  wrap.innerHTML = '';
  wrap.appendChild(table);
}

let saveQueue = Promise.resolve();

function saveRow(tr, original, isAdmin){
  const saveBtn = tr.querySelector('[data-act="save"]');
  if(saveBtn) saveBtn.disabled = true;

  // เข้าคิวทีละแถว กันยิง request หลายสิบตัวพร้อมกันจนหลุด (Failed to fetch)
  saveQueue = saveQueue
    .then(() => doSaveRow(tr, original, isAdmin))
    .catch(() => {}) // ไม่ให้แถวหนึ่งพังแล้วทำให้คิวที่เหลือหยุดไปด้วย
    .then(() => { if(saveBtn) saveBtn.disabled = false; });

  return saveQueue;
}

async function doSaveRow(tr, original, isAdmin, isRetry){
  const statusEl = $('staffPanelStatus');
  const payload = { action: 'update', password: staffSession.password, receiptNo: original.receiptNo };

  if(isAdmin){
    const fields = {};
    tr.querySelectorAll('[data-field]').forEach(el => {
      if(el.tagName === 'SELECT') fields['สถานะ'] = el.value;
      else if(el.dataset.field === 'notes') fields['หมายเหตุ'] = el.value;
      else fields[el.dataset.field] = el.value;
    });
    payload.fields = fields;
  } else {
    tr.querySelectorAll('[data-field]').forEach(el => {
      if(el.dataset.field === 'status') payload.status = el.value;
      if(el.dataset.field === 'notes') payload.notes = el.value;
    });
  }

  statusEl.textContent = 'กำลังบันทึก ' + original.receiptNo + '...';
  statusEl.className = 'status-msg';
  try{
    const res = await fetch(SHEET_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    statusEl.textContent = data.status === 'ok' ? 'บันทึกแล้ว: ' + original.receiptNo : (data.message || 'บันทึกไม่สำเร็จ: ' + original.receiptNo);
    statusEl.className = 'status-msg ' + (data.status === 'ok' ? 'ok' : 'err');
  }catch(err){
    if(!isRetry){
      // เชื่อมต่อหลุดกลางทาง ลองซ้ำอีกครั้งอัตโนมัติหลังจากรอสักครู่
      await new Promise(r => setTimeout(r, 800));
      return doSaveRow(tr, original, isAdmin, true);
    }
    statusEl.textContent = 'บันทึกไม่สำเร็จ (' + original.receiptNo + '): ' + err.message + ' — ลองกดปุ่มบันทึกอีกครั้ง';
    statusEl.className = 'status-msg err';
  }
}

async function deleteRow(row){
  const ok = await customConfirm('ยืนยันลบใบสมัครของ "' + row.name + '" (' + row.receiptNo + ') ใช่หรือไม่?\nทำแล้วกู้คืนไม่ได้');
  if(!ok) return;
  saveQueue = saveQueue.then(() => doDeleteRow(row)).catch(() => {});
  return saveQueue;
}

async function doDeleteRow(row, isRetry){
  const statusEl = $('staffPanelStatus');
  statusEl.textContent = 'กำลังลบ ' + row.receiptNo + '...';
  statusEl.className = 'status-msg';
  try{
    const res = await fetch(SHEET_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'delete', password: staffSession.password, receiptNo: row.receiptNo })
    });
    const data = await res.json();
    if(data.status === 'ok'){
      statusEl.textContent = 'ลบแล้ว: ' + row.receiptNo;
      statusEl.className = 'status-msg ok';
      $('staffRefreshBtn').click();
    } else {
      statusEl.textContent = data.message || ('ลบไม่สำเร็จ: ' + row.receiptNo);
      statusEl.className = 'status-msg err';
    }
  }catch(err){
    if(!isRetry){
      await new Promise(r => setTimeout(r, 800));
      return doDeleteRow(row, true);
    }
    statusEl.textContent = 'ลบไม่สำเร็จ (' + row.receiptNo + '): ' + err.message + ' — ลองกดปุ่มลบอีกครั้ง';
    statusEl.className = 'status-msg err';
  }
}

// ================= ดาวน์โหลดข้อมูลใบสมัครทั้งหมดเป็น CSV =================
$('exportCsvBtn').addEventListener('click', () => {
  const statusEl = $('staffPanelStatus');
  if(!lastResults.length){
    statusEl.textContent = 'ยังไม่มีข้อมูลให้ดาวน์โหลด (ลองกดรีเฟรชข้อมูลก่อน)';
    statusEl.className = 'status-msg err';
    return;
  }

  const headers = [
    'วันที่/เวลาบันทึก', 'เลขที่ใบสมัคร', 'ชื่อ-นามสกุล', 'วันเกิด',
    'เบอร์โทรศัพท์', 'อีเมล', 'ที่อยู่', 'ตำแหน่งที่สมัคร',
    'เงินเดือนที่คาดหวัง', 'วุฒิการศึกษา', 'เกรดเฉลี่ยรวม', 'มหาวิทยาลัย',
    'ประสบการณ์ทำงาน', 'เอกสารที่แนบมาด้วย', 'ไฟล์แนบ (ลิงก์)', 'สถานะ', 'หมายเหตุ'
  ];

  const csvEscape = (val) => {
    const s = String(val === undefined || val === null ? '' : val);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  };

  const rows = lastResults.map(r => [
    r.date ? new Date(r.date).toLocaleString('th-TH') : '',
    r.receiptNo, r.name, r.dob, r.phone, r.email, r.address, r.position,
    r.salary, r.education, r.gpa, r.university,
    r.experience, r.documents, (r.files || '').split('\n').filter(Boolean).join(' | '),
    r.status, r.notes
  ]);

  const csvContent = [headers, ...rows].map(row => row.map(csvEscape).join(',')).join('\r\n');
  // ใส่ BOM นำหน้าเพื่อให้ Excel เปิดภาษาไทยได้ถูกต้อง ไม่เพี้ยน
  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = 'ใบสมัครงาน_' + stamp + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  statusEl.textContent = 'ดาวน์โหลดไฟล์ CSV เรียบร้อยแล้ว (' + lastResults.length + ' รายการ)';
  statusEl.className = 'status-msg ok';
});

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
